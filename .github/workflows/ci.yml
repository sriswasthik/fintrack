name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client (lint / typecheck / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The lockfile lives at the workspace root, so install the whole monorepo
      # and then run only this workspace's scripts.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace client

      - name: Typecheck
        run: npm run typecheck --workspace client

      - name: Test
        run: npm run test --workspace client

  server:
    name: server (lint / typecheck / test)
    runs-on: ubuntu-latest

    # The aggregation rules of PROJECT_CONTEXT.md §5 live in SQL, so the tests
    # that prove them need a real Postgres (see
    # src/services/dashboard/aggregate.integration.test.ts). They skip when
    # DATABASE_URL is unset, which is what a contributor without a database
    # gets locally.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fintrack_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma Client is generated from schema.prisma and not committed, so it
      # has to exist before anything typechecks or imports it. No database is
      # needed for this step.
      - name: Generate Prisma Client
        run: npm run db:generate --workspace server

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        working-directory: server

      - name: Lint
        run: npm run lint --workspace server

      - name: Typecheck
        run: npm run typecheck --workspace server

      - name: Test
        run: npm run test --workspace server
