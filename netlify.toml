# Netlify alternative to vercel.json — deploy the client to either, not both.

[build]
  # The client imports nothing from the server, but the root install runs both
  # workspaces' postinstall, and server/ needs a generated Prisma Client to
  # typecheck. Generating it needs no database.
  command = "npm run db:generate --workspace server && npm run build --workspace client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

# A single-page app: every path is served by index.html and routed in the
# browser. Without this, a reload on /dashboard is a 404 from the CDN.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
